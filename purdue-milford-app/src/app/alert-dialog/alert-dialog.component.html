<div class="">
  <h2 mat-dialog-title>{{ title }}</h2>

  <mat-dialog-content class="dialog-content">
    <pre>{{ content }}</pre>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button (click)="onClick('ok')" cdkFocusInitial>Ok</button>
  </mat-dialog-actions>
</div>
