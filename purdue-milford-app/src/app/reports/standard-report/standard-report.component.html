<table mat-table [dataSource]="dataSource" matSort [matSortActive]="sortBy" [matSortDirection]="sortDirection" appMatSortCache>
  <ng-container *ngFor="let field of fieldNames" [matColumnDef]="field.column">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ field.name }}</th>
    <td mat-cell *matCellDef="let d">
      {{ getColumnValue(d, field) }}
    </td>
    <td mat-footer-cell *matFooterCellDef>
      {{ getFooterValue(field) }}
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>

  <tr class="row-space-between" *matNoDataRow>
    <td class="mat-cell" colspan="9999">No data. Click refresh to load latest available data</td>
  </tr>
</table>
