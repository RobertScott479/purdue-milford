<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Stations</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <app-alert [alert]="stationService.alert"></app-alert>
    <form [formGroup]="trimlineService.frmGroup">
      <div class="mat-row">
        <div class="mat-col">
          <mat-form-field appearance="outline">
            <mat-label>Server</mat-label>
            <mat-select
              [disabled]="this.stationService.showSpinner()"
              #serverSelect
              class=""
              formControlName="serverIndex"
              (selectionChange)="onServerChange()"
            >
              @for(s of serverList; track s.index ){
              <mat-option [value]="s.index">{{ s.server }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </form>

    <app-mat-progress-spinner [visible]="stationService.showSpinner()" [delay]="100" mode="indeterminate"></app-mat-progress-spinner>

    <div class="table-container">
      <table
        mat-table
        #myTable
        [dataSource]="stationService.datasourceStations"
        class="station-table"
        matSort
        matSortActive="station"
        matSortDirection="asc"
      >
        <!-- Enabled Column -->
        <ng-container matColumnDef="enabled">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Enabled</th>
          <td mat-cell *matCellDef="let i">
            <mat-slide-toggle (toggleChange)="onChange(i.station)" [checked]="i.enabled" [disabled]="showSpinner()"> </mat-slide-toggle>
          </td>
        </ng-container>

        <!-- Station Column -->
        <ng-container matColumnDef="station">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Station</th>
          <td mat-cell *matCellDef="let station">{{ station.station }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr *matNoDataRow>
          <td colspan="9999">No data available</td>
        </tr>
      </table>
    </div>
  </mat-card-content>
  <mat-card-footer>
    <div class="footer-container">
      <div class="button-group">
        <button mat-stroked-button [disabled]="!stationService.dirty || showSpinner()" (click)="onSaveStations()">Save</button>
        <button mat-stroked-button [disabled]="!stationService.dirty || showSpinner()" (click)="onCancel()">Cancel</button>
      </div>
      <app-server-status-indicators [serverList]="stationService.homeService.serverMap.dataSource.data"></app-server-status-indicators>
    </div>
  </mat-card-footer>
</mat-card>
