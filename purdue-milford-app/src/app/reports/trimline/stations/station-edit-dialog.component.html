<h2 mat-dialog-title>Edit Station {{ station.station }}</h2>

<mat-dialog-content>
  <div class="dialog-content">
    <div class="enable-toggle">
      <mat-slide-toggle [(ngModel)]="enabled" color="primary" (change)="toggleChanged($event)"> Station Enabled </mat-slide-toggle>
    </div>

    <div class="employee-fields" *ngIf="enabled">
      <mat-form-field appearance="outline" class="employee-field">
        <mat-label>Primary Employee</mat-label>
        <input matInput [formControl]="primaryEmployeeControl" [matAutocomplete]="primaryAuto" placeholder="Type name or number..." />
        <mat-autocomplete #primaryAuto="matAutocomplete" [displayWith]="displayEmployee">
          <mat-option *ngFor="let employee of filteredPrimaryEmployees | async" [value]="employee">
            {{ employee.name }} ({{ employee.cutter_number }})
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>

      <mat-form-field appearance="outline" class="employee-field">
        <mat-label>Alternate Employee</mat-label>
        <input matInput [formControl]="alternateEmployeeControl" [matAutocomplete]="alternateAuto" placeholder="Type name or number..." />
        <mat-autocomplete #alternateAuto="matAutocomplete" [displayWith]="displayEmployee">
          <mat-option *ngFor="let employee of filteredAlternateEmployees | async" [value]="employee">
            {{ employee.name }} ({{ employee.cutter_number }})
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button [disabled]="!saveEnabled" mat-raised-button (click)="onSave()">Save</button>
</mat-dialog-actions>
