<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Key-in sample count</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="table-container">
      <div class="keypad-container">
        <app-keypad (LoginEvent)="onEnter($event)" (KeyPressEvent)="onKeyPress()" [keyPress]="data.toString()"></app-keypad>
      </div>
    </div>
  </mat-card-content>
</mat-card>
