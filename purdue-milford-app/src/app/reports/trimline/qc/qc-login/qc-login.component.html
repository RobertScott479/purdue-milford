<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>QA Checker Login</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="table-container">
      <app-alert class="alert-large" [alert]="alert"></app-alert>
      <div class="keypad-container">
        <app-keypad (LoginEvent)="onQCLogin($event)" (KeyPressEvent)="onKeyPress()"></app-keypad>
      </div>
    </div>
  </mat-card-content>
</mat-card>
